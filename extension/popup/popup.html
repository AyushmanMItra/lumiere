<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumière Watch Party</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
      <div class="popup-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="2" y="2" width="20" height="20" rx="3"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
        <span>Lumière</span>
      </div>
      <div class="popup-status" id="statusIndicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <!-- Connection Form -->
    <div id="connectForm" class="popup-section">
      <div class="form-group">
        <label for="serverUrl">SERVER URL</label>
        <input type="text" id="serverUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
      </div>
      <div class="form-group">
        <label for="username">USERNAME</label>
        <input type="text" id="username" placeholder="Enter your name" maxlength="20">
      </div>
      <div class="form-row">
        <div class="form-group" style="flex: 1">
          <label for="roomId">ROOM CODE</label>
          <input type="text" id="roomId" placeholder="e.g. ABC123" maxlength="30">
        </div>
        <button id="randomRoomBtn" class="dice-btn" title="Random Room Code">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="4"></rect>
            <circle cx="8" cy="8" r="1.5" fill="currentColor"></circle>
            <circle cx="16" cy="16" r="1.5" fill="currentColor"></circle>
            <circle cx="16" cy="8" r="1.5" fill="currentColor"></circle>
            <circle cx="8" cy="16" r="1.5" fill="currentColor"></circle>
          </svg>
        </button>
      </div>
      <button id="connectBtn" class="btn btn-primary btn-block">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <span>Connect &amp; Sync Player</span>
      </button>
    </div>

    <!-- Connected State -->
    <div id="connectedPanel" class="popup-section hidden">
      <div class="connected-info">
        <div class="info-row">
          <span class="info-label">Room</span>
          <span class="info-value" id="connectedRoom">---</span>
        </div>
        <div class="info-row">
          <span class="info-label">Username</span>
          <span class="info-value" id="connectedUser">---</span>
        </div>
        <div class="info-row">
          <span class="info-label">Platform</span>
          <span class="info-value platform-badge" id="connectedPlatform">---</span>
        </div>
      </div>
      <div class="button-stack">
        <button id="openTheaterBtn" class="btn btn-secondary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 10l5-5v14l-5-5"></path>
            <rect x="2" y="6" width="13" height="12" rx="2"></rect>
          </svg>
          <span>Open Theater &amp; WebRTC Call</span>
        </button>
        <button id="disconnectBtn" class="btn btn-danger btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span>Disconnect</span>
        </button>
      </div>
    </div>

    <!-- Supported Platforms -->
    <div class="popup-platforms">
      <span class="platforms-label">SUPPORTED STREAMING PLATFORMS</span>
      <div class="platform-icons">
        <span class="platform-tag tag-netflix">Netflix</span>
        <span class="platform-tag tag-prime">Prime Video</span>
        <span class="platform-tag tag-hotstar">JioHotstar</span>
        <span class="platform-tag tag-zee5">Zee5</span>
        <span class="platform-tag tag-disney">Disney+</span>
        <span class="platform-tag tag-sony">SonyLIV</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="popup-footer">
      <span>Lumière v1.1 &middot; by Ayushman Mitra</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
