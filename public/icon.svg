<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eb459e"/>
      <stop offset="100%" stop-color="#5865f2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#eb459e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for maskable icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Cinema Reel / Projector Film Strip Logo -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <rect x="25" y="25" width="250" height="250" rx="36" fill="none" stroke="url(#accentGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Film Perforations Left -->
    <line x1="88" y1="25" x2="88" y2="275" stroke="url(#accentGrad)" stroke-width="26"/>
    <!-- Film Perforations Right -->
    <line x1="212" y1="25" x2="212" y2="275" stroke="url(#accentGrad)" stroke-width="26"/>
    <!-- Horizontal Cross -->
    <line x1="25" y1="150" x2="275" y2="150" stroke="url(#accentGrad)" stroke-width="26"/>
    <!-- Left Sprocket Holes -->
    <line x1="25" y1="88" x2="88" y2="88" stroke="url(#accentGrad)" stroke-width="26"/>
    <line x1="25" y1="212" x2="88" y2="212" stroke="url(#accentGrad)" stroke-width="26"/>
    <!-- Right Sprocket Holes -->
    <line x1="212" y1="88" x2="275" y2="88" stroke="url(#accentGrad)" stroke-width="26"/>
    <line x1="212" y1="212" x2="275" y2="212" stroke="url(#accentGrad)" stroke-width="26"/>
    <!-- Center Play Triangle -->
    <polygon points="135,115 178,150 135,185" fill="#ffffff"/>
  </g>
</svg>